[workspace]
members = [
    "axiom-core",
    "axiom-llm",
    "axiom-agents",
    # "axiom-rag",  # Temporarily disabled due to build issues
    # "axiom-wasm",  # Temporarily disabled due to build issues
    # "axiom-monitoring",  # Temporarily disabled due to build issues
    "axiom-examples",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Axiom Contributors"]
license = "MIT"
repository = "https://github.com/axiom-rust/axiom"
description = "A streaming-first, production-ready LangChain alternative in Rust"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }
hyper = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics and monitoring
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# Vector operations and ML - temporarily disabled due to dependency conflicts
# candle-core = "0.3"
# candle-nn = "0.3"
# candle-transformers = "0.3"

# Database and storage
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite"] }
redis = { version = "0.24", features = ["tokio-comp"] }

# WASM support
wasmtime = "15.0"
wasmtime-wasi = "15.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.4"
base64 = "0.21"
hex = "0.4"

# Testing
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
